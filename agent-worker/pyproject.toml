[project]
name = "kodexo-voice-agent-worker"
version = "0.1.0"
description = "LiveKit agent worker: STT (Deepgram) -> LLM (Groq) -> TTS (Deepgram Aura) inbound sales-qualification voice agent"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=1.0",
    "livekit-plugins-deepgram",
    "livekit-plugins-silero",
    "livekit-plugins-groq",
    "livekit-plugins-google",  # Gemini Live -- opt-in realtime engine, see VOICE_STACK_DECISION.md
    # Arrives with the plugin above anyway, but entrypoint.py imports it
    # directly to build Gemini's activity-detection config, so it's a real
    # first-order dependency rather than a transitive one.
    "google-genai",
    "livekit-plugins-noise-cancellation",
    "supabase>=2.9",
    # A real Postgres connection, for `python -m worker.migrate` only. The
    # supabase client above goes through PostgREST, which cannot run DDL, so
    # the schema cannot be created with it. Nothing on the call path uses this.
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Call recordings: Egress writes the file, this uploads it. Imported lazily
    # inside recording.py so a worker with CALL_RECORDING_ENABLED off doesn't
    # need it resolved to take calls.
    "cloudinary>=1.40",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["worker"]
